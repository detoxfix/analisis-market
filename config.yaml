# =====================================================================
#  IHSG Signal — konfigurasi utama
#  Semua angka Rupiah ditulis penuh (tanpa titik pemisah ribuan).
# =====================================================================

universe:
  min_market_cap: 5000000000000      # hanya saham dengan kapitalisasi pasar >= Rp 5 T
  min_avg_value_20d: 5000000000      # likuiditas: rata-rata nilai transaksi 20 hari >= Rp 5 M
  min_price: 50
  max_stale_days: 5                  # buang saham yang tidak diperdagangkan (suspensi) > 5 hari
  use_idx_list: true                 # ambil daftar emiten + jumlah saham dari idx.co.id (publik)
  seed_file: data/tickers_seed.csv   # cadangan bila situs IDX tidak bisa diakses
  exclude: []                        # kode saham yang ingin dikecualikan manual, mis. [GOTO, BUKA]

data:
  history_period: 3y                 # riwayat harga harian yang diunduh
  benchmark: "^JKSE"                 # IHSG
  fundamentals_cache_days: 7         # fundamental di-refresh mingguan (berubah per kuartal)
  shares_cache_days: 7
  ready_after: "17:00"               # jam WIB saat data penutupan hari itu biasanya sudah ada di Yahoo
  holidays:                          # libur bursa BEI (Sabtu/Minggu otomatis) agar peringatan "data basi" tidak salah
    - "2026-12-25"                   # Natal
    - "2026-12-31"                   # libur khusus bursa akhir tahun
    # tambahkan cuti bersama / libur lain dari kalender idx.co.id, mis. - "2026-12-24"

capital: 100000000                   # modal acuan untuk menghitung lot (Rp 100 jt)
risk_per_trade: 0.01                 # maks. rugi per posisi = 1% modal (batas jumlah lot)

fees:                                # biaya broker rata-rata, sudah termasuk PPh final 0,1% saat jual
  buy: 0.0015
  sell: 0.0025

thresholds:                          # skor -100..+100 -> sinyal
  strong_buy: 60
  buy: 30
  sell: -30
  strong_sell: -60

# Parameter pendek & menengah hasil tuning data asli 28-10-2026 (lihat docs/data/tuning.json)
horizons:
  short:
    label: "Jangka Pendek (Swing)"
    allocation: 0.20                 # porsi modal untuk bucket ini
    max_positions: 5
    max_weight: 0.30                 # bobot maks. satu saham di dalam bucket
    sector_cap: 0.50
    hold_min_days: 3
    hold_max_days: 15                # time-stop (hari bursa)
    entry_atr: 0.5                   # area beli: harga - 0,5 ATR
    chase_atr: 0.3                   # batas kejar: harga + 0,3 ATR (lewat ini, batal beli)
    sl_atr: 2.5
    max_sl_pct: 0.10
    rr: [2.0, 3.0]                   # TP1 = 2R ; TP2 = 3R
    min_score: 60                    # skor minimum untuk boleh beli
    market_filter: ema20             # none | ema20 | sma50 | sma200 : beli hanya bila IHSG di atas MA ini
    trend_filter: sma200             # none | sma50 | sma200 : beli hanya bila harga saham di atas MA ini
    entry_mode: limit                # open = beli di pembukaan T+1 ; limit = antre di area bawah
    limit_days: 3                    # masa berlaku antrean (mode limit)
    trail_ma: 0                      # 0 = mati ; n = setelah TP1, jual sisa bila close < EMA n
    market_exit: none                # none | half | all : jual saat IHSG berbalik turun (posisi terbuka)
    market_exit_ma: sma50            # ema20 | sma50 : MA IHSG yang dipakai
    market_exit_confirm: 1           # berapa hari close berturut-turut di bawah MA
  medium:
    label: "Jangka Menengah (1-3 bulan)"
    allocation: 0.30
    max_positions: 8
    max_weight: 0.20
    sector_cap: 0.40
    hold_min_days: 20
    hold_max_days: 40
    entry_atr: 1.0
    chase_atr: 0.2
    sl_atr: 3.5
    max_sl_pct: 0.15
    rr: [2.5, 4.0]
    min_score: 60
    market_filter: sma50
    trend_filter: sma50
    entry_mode: open
    limit_days: 5
    trail_ma: 0
    market_exit: none
    market_exit_ma: sma50
    market_exit_confirm: 1
  long:
    label: "Jangka Panjang (6-24 bulan)"
    allocation: 0.50
    max_positions: 10
    max_weight: 0.15
    sector_cap: 0.35
    hold_min_days: 120
    hold_max_days: 500
    entry_atr: 1.5
    chase_atr: 0.0
    sl_atr: 4.0
    max_sl_pct: 0.20
    rr: [1.5, 3.0]
    min_score: 30
    market_filter: none
    trend_filter: sma200             # cicil hanya saham yang harganya di atas SMA200 (tren primer naik)
    regime_scale:                    # porsi bucket yang boleh dipakai menurut posisi IHSG
      above_sma200: 1.0              # IHSG di atas SMA200: penuh
      above_sma50: 0.6               # di bawah SMA200 tapi di atas SMA50: 60%
      below: 0.3                     # di bawah keduanya (bearish): 30%, sisanya kas

backtest:
  horizons: [short, medium]          # jangka panjang butuh fundamental historis, tidak di-backtest
  refresh_days: 7
  split_date: "2025-05-01"           # sebelum = in-sample (untuk memilih), sesudah = out-of-sample (untuk menguji)

archive:                             # arsip fundamental untuk backtest jangka panjang di masa depan
  statements_days: 7                 # tiap saham diperbarui laporan keuangannya seminggu sekali
  statements_per_run: 60             # maks. saham per hari (bergilir, agar tidak kena limit Yahoo)

news:                                # peringatan berita negatif (hanya info, tidak mengubah sinyal)
  enabled: true
  days: 7                            # berita 7 hari terakhir
  google_news: true                  # Google News RSS, satu pencarian per saham universe
  delay_sec: 0.4
  time_budget_sec: 240               # batas waktu total pengambilan berita
  feeds:                             # RSS portal berita pasar modal (yang gagal diabaikan)
    - https://www.cnbcindonesia.com/market/rss
    - https://www.kabarbursa.com/feed/insight-emiten.xml
    - https://www.antaranews.com/rss/ekonomi-bursa.xml
    - https://rss.tempo.co/bisnis
    - https://investasi.kontan.co.id/rss
    - https://market.bisnis.com/rss
    - https://www.idxchannel.com/rss

monitor:                             # alarm: track record sungguhan vs perkiraan backtest
  min_trades: 10                     # penilaian penuh mulai 10 transaksi selesai
  early_trades: 5                    # alarm dini (rentetan rugi / win rate terlalu rendah) mulai 5 transaksi
  recent_trades: 20                  # cek juga 20 transaksi terakhir
  streak_min: 3                      # rentetan rugi mulai diuji dari 3 kali berturut-turut
  assumed_win_rate: 0.5              # pembanding untuk horizon yang tidak di-backtest (jangka panjang)

idx:                                 # data idx.co.id (otomatis dilewati bila situs memblokir, mis. di GitHub)
  foreign_flow: true                 # transaksi asing harian (ditampilkan; belum dipakai dalam skor)
  backfill_days: 260                 # riwayat yang diisi sekali di awal (~1 tahun bursa)
  max_per_run: 300

positions:                           # pemantau posisi pribadi (isi file positions.csv di repo)
  dashboard: percent                 # full | percent (tanpa lot & nominal Rp) | hidden ; Telegram selalu lengkap

notify:
  telegram: true                     # aktif hanya bila secret TELEGRAM_BOT_TOKEN & TELEGRAM_CHAT_ID diisi
  dashboard_url: "https://detoxfix.github.io/analisis-market/"
