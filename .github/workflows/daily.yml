name: Update sinyal IHSG harian

on:
  schedule:
    # GitHub sering menunda jadwal berjam-jam, jadi update dijalankan beberapa kali.
    # Telegram hanya dikirim sekali per tanggal data (--notify-once).
    - cron: "30 10 * * 1-5"      # 17:30 WIB Senin-Jumat (setelah bursa tutup)
    - cron: "30 13 * * 1-5"      # 20:30 WIB Senin-Jumat (cadangan)
    - cron: "30 23 * * 0-4"      # 06:30 WIB Senin-Jumat (sebelum bursa buka)
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ihsg-signal
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependensi
        run: pip install -r requirements.txt pytest

      - name: Uji unit (dashboard tidak diterbitkan bila gagal)
        run: python -m pytest -q tests

      - name: Jalankan scraper + mesin sinyal
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          if [ "${{ github.event_name }}" = "schedule" ]; then ONCE="--notify-once"; fi
          python main.py --backtest auto $ONCE
          touch docs/.nojekyll

      - name: Simpan hasil ke repo
        run: |
          git config user.name "ihsg-signal-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs data
          git commit -m "Sinyal $(TZ=Asia/Jakarta date +%F)" || echo "Tidak ada perubahan"
          git pull --rebase
          git push

      - name: Kabari Telegram bila gagal
        if: failure()
        env:
          TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          CHAT: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          [ -z "$TOKEN" ] && exit 0
          for c in ${CHAT//,/ }; do
            curl -s -X POST "https://api.telegram.org/bot$TOKEN/sendMessage" -d chat_id="$c" --data-urlencode text="Update sinyal IHSG GAGAL. Lihat: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          done
