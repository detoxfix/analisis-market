name: Build aplikasi Windows
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependensi
        run: pip install -r requirements.txt pyinstaller==6.22.3
      - name: Build IHSG Signal.exe
        run: pyinstaller --noconfirm ihsg_signal.spec
      - name: Uji aplikasi hasil build
        shell: pwsh
        timeout-minutes: 10
        run: |
          $p = Start-Process -FilePath "dist\IHSG Signal\IHSG Signal.exe" -ArgumentList "--selftest" -Wait -PassThru
          Get-Content "dist\IHSG Signal\logs\selftest.log"
          if ($p.ExitCode -ne 0) { Write-Error "Selftest gagal"; exit 1 }
      - name: Bersihkan sisa uji
        shell: pwsh
        run: |
          $d = "dist\IHSG Signal"
          foreach ($x in "logs","output","docs","data","settings.json","positions.csv",".update.lock") {
            if (Test-Path "$d\$x") { Remove-Item "$d\$x" -Recurse -Force }
          }
          if (Test-Path "CARA PAKAI.txt") { Copy-Item "CARA PAKAI.txt" "$d\CARA PAKAI.txt" }
      - uses: actions/upload-artifact@v4
        with:
          name: IHSG-Signal-Windows
          path: dist/IHSG Signal/
          retention-days: 30
