name: Riset (branch riset-*)
on:
  push:
    branches: ["riset-**"]
    paths-ignore: ["docs/data/**"]
permissions:
  contents: write
jobs:
  riset:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with: {python-version: "3.12", cache: pip}
      - run: pip install -r requirements.txt
      - run: python tools/cek_yahoo.py
      - run: |
          git config user.name "ihsg-signal-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f docs/data/cek_yahoo.json
          git commit -m "Hasil cek Yahoo" || true
          git push
