name: Riset (branch riset-*)
on:
  push:
    branches: ["riset-**"]
    paths-ignore: ["docs/data/**"]
permissions:
  contents: write
jobs:
  riset:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with: {python-version: "3.12", cache: pip}
      - run: pip install -r requirements.txt pytest
      - run: python -m pytest -q tests
      - run: python tools/uji_per_jam.py
      - run: python main.py --no-notify --backtest never 2>&1 | tee docs/data/uji_run.log
      - if: always()
        run: |
          git config user.name "ihsg-signal-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f docs/data/uji_per_jam.json docs/data/uji_run.log docs/data/latest.json
          git commit -m "Hasil uji data per jam" || true
          git push
